name: Deploy TS Express API to Fly (production)

# HEL-96 — deploys the consolidated AutoFlow Express backend to
# `autoflow-api-production`. The legacy `autoflow-fastapi-production`
# relay shim was retired in HEL-97; api.helloautoflow.com's Cloudflare
# CNAME points directly at autoflow-api-production.fly.dev.

on:
  push:
    branches: [master]
    paths:
      - "src/**"
      - "docker/api/**"
      - "fly.api.production.toml"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - ".github/workflows/deploy-fly-api-production.yml"
      - "infra/scripts/fly_api_smoke.sh"
      - "migrations/**"
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: deploy-fly-api-production
  cancel-in-progress: false

env:
  FLY_APP: autoflow-api-production
  FLY_REGION: ord

jobs:
  validate:
    name: Validate backend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx jest --config jest.config.cjs --runInBand --testPathIgnorePatterns="dashboard"
        env:
          AUTOFLOW_ALLOW_INMEMORY: "true"
          NODE_ENV: test

  deploy:
    name: Deploy to Fly
    runs-on: ubuntu-latest
    needs: [validate]
    environment: production
    steps:
      - uses: actions/checkout@v5
        with:
          # HEL-345: full history so Sentry can associate commits to the release.
          fetch-depth: 0

      - name: Pull production secrets from Infisical
        uses: Infisical/secrets-action@v1.0.9
        with:
          method: universal
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          project-slug: auto-flow-va-pt
          env-slug: production

      - name: Verify required env vars
        run: |
          set -euo pipefail
          for v in FLY_API_TOKEN INFISICAL_PROJECT_ID INFISICAL_TOKEN_PRODUCTION; do
            if [[ -z "${!v:-}" ]]; then
              echo "::error::Missing required secret: $v"
              exit 1
            fi
          done

      # HEL-345: detect the Sentry release token (pulled from Infisical above).
      # Reads it from the process env the secrets-action exports, so the gate
      # below is reliable regardless of env-context propagation. When absent,
      # the release step is skipped and CI stays green.
      - name: Detect Sentry release token
        id: sentry_token_check
        run: |
          if [[ -n "${SENTRY_AUTH_TOKEN:-}" ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::SENTRY_AUTH_TOKEN not in Infisical's production env — skipping Sentry release/deploy (HEL-345)."
          fi

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Ensure Fly app exists
        env:
          FLY_API_TOKEN: ${{ env.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          if ! flyctl apps list | grep -q "^${FLY_APP}\b"; then
            flyctl apps create "${FLY_APP}" --org personal
          fi

      - name: Sync Fly machine-level secrets
        env:
          FLY_API_TOKEN: ${{ env.FLY_API_TOKEN }}
        run: |
          flyctl secrets set \
            INFISICAL_PROJECT_ID="${INFISICAL_PROJECT_ID}" \
            INFISICAL_TOKEN="${INFISICAL_TOKEN_PRODUCTION}" \
            --app "${FLY_APP}" \
            --stage

      - name: Deploy
        env:
          FLY_API_TOKEN: ${{ env.FLY_API_TOKEN }}
        run: |
          flyctl deploy \
            --config fly.api.production.toml \
            --remote-only \
            --strategy bluegreen \
            --env SENTRY_RELEASE="${{ github.sha }}" \
            --build-arg BUILD_SHA="${{ github.sha }}" \
            --build-arg BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

      # HEL-345: create the Sentry release for node-express, associate commits,
      # and mark a `production` deploy. version == github.sha matches the runtime
      # release tag (flyctl --env SENTRY_RELEASE).
      - name: Create Sentry release + deploy
        if: ${{ steps.sentry_token_check.outputs.present == 'true' }}
        uses: getsentry/action-release@v3
        env:
          SENTRY_ORG: autoflow-mo
          SENTRY_PROJECT: node-express
        with:
          environment: production
          version: ${{ github.sha }}
          set_commits: auto
          finalize: true

      - name: Smoke test
        env:
          FLY_API_TOKEN: ${{ env.FLY_API_TOKEN }}
          FLY_API_SMOKE_ORIGIN: https://app.helloautoflow.com
        run: |
          bash infra/scripts/fly_api_smoke.sh "https://${FLY_APP}.fly.dev"

      - name: Summarize
        run: |
          {
            echo "## Deploy: ${FLY_APP}"
            echo
            echo "- Health: $(curl -s -o /dev/null -w '%{http_code}' https://${FLY_APP}.fly.dev/health)"
            echo "- Custom domain: https://api.helloautoflow.com"
          } >> "$GITHUB_STEP_SUMMARY"
