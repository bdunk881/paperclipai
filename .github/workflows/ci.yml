name: CI

on:
  pull_request:
    branches: [master, staging, dev]    # was: [master, main, staging]
  push:
    branches: [master, staging, dev]    # was: [master, main, staging]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-frontend:
    name: Lint Frontend
    if: github.ref_name != 'dev' && (github.event_name != 'pull_request' || github.base_ref != 'dev')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run type-check

  lint-api:
    name: Lint API (TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Forbid control_plane_* in customer surfaces
        run: |
          if git grep -lnE 'control_plane_(agent|team|task|execution|heartbeat|spend|budget|audit|company)' \
             -- 'dashboard/' 'landing/'; then
            echo "Customer-facing surface leaked an internal noun — see docs/glossary.md"
            exit 1
          fi
      - name: Forbid Azure Container Registry references (HEL-163)
        run: |
          if git grep -lnE 'azurecr\.io|autoflowacr\.azurecr|autoflowproductionacr' -- . \
             -- ':!k8s/README.md' ':!.github/workflows/ci.yml'; then
            echo "Azure ACR image references are retired — deploy via Fly.io (see AGENTS.md)"
            exit 1
          fi
      - name: Require requireRole() on every authenticated API route mount
        run: |
          # Every app.use("/api/...") with requireAuth must also declare requireRole()
          # or be in the explicit allowlist. Allowlisted paths use their own
          # auth gate (workspaces = pre-workspace flow; admin = requireStaff).
          violations=$(grep -n 'app\.use("/api/' src/app.ts \
            | grep 'requireAuth' \
            | grep -v 'requireRole(' \
            | grep -Ev '"/api/workspaces[/"]|"/api/admin/|"/api/activity-events"|"/api/org-graph"|"/api/runs/|"/api/budgets"|"/api/entitlements"|"/api/wake-events"|"/api/connector-connections"|"/api/hosted-free-models"|"/api/user"|"/api/user-profile"' \
            || true)
          if [ -n "$violations" ]; then
            printf 'FAIL: app.use mounts have requireAuth but no requireRole() — add requireRole() or the allowlist comment:\n%s\n' "$violations"
            exit 1
          fi
      - name: Guard against new top-level in-memory Maps in src/
        run: |
          # DASH-65: every new top-level `const|let X = new Map<>` in src/
          # must declare `// allowlist:` on the SAME or PREVIOUS line with a
          # short rationale. Memory-only stores have repeatedly caused
          # silent data-loss bugs after restart (HEL-139 audit: HITL,
          # /api/memory, integrationCredentialStore, mcpStore, webhookRelay,
          # subscriptionStore, entitlements). Customer-facing state belongs
          # in Postgres. The remaining legitimate Maps (PKCE/OAuth state,
          # webhook replay caches, process registries) just need the
          # comment.
          violations=$(git grep -nE '^(const|let)\s+\w+\s*=\s*new Map<' -- 'src/**/*.ts' \
            | grep -v '\.test\.ts' \
            | grep -v '/__mocks__/' \
            | while IFS=: read -r file line content; do
                allow_same=$(printf '%s\n' "$content" | grep -c 'allowlist:')
                allow_prev=$(sed -n "$((line - 1))p" "$file" | grep -c 'allowlist:')
                if [ "$allow_same" -eq 0 ] && [ "$allow_prev" -eq 0 ]; then
                  echo "$file:$line: $content"
                fi
              done)
          if [ -n "$violations" ]; then
            printf 'FAIL: new top-level Map<> in src/ without `// allowlist: <reason>`:\n%s\n' "$violations"
            printf '\nIf this is a customer-data store, migrate it to Postgres (see docs/audit/2026-05-18-postgres-migration-plan.md).\nIf this is genuinely process-local (OAuth state, replay cache, runtime registry), add a `// allowlist: <reason>` comment on the same or previous line.\n'
            exit 1
          fi
      - name: Forbid direct executeAgentPrompt/runAgentTurn imports outside the worker (HEL-177)
        run: |
          # HEL-177: every agent run must go through the BullMQ queue. Routes
          # may only enqueue; the worker is the sole consumer. Importing the
          # primitives directly anywhere in src/ outside `src/worker.ts` (or
          # the primitive's own module + tests) re-introduces in-process
          # execution which defeats durable-execution guarantees and gets
          # rolled back on API restart.
          #
          # Codex P2 #1: pathspec covers BOTH top-level src/*.ts and nested
          # src/**/*.ts — a future inline import in src/app.ts or
          # src/bootstrap.ts must still fail this guard.
          # Codex P2 #2: match BOTH static (`from "..."`) and dynamic
          # (`import("...")` / `import('...')`) imports. The previous
          # implementation used dynamic import as the lazy-load mechanism,
          # so leaving that pattern uncovered would let the exact regression
          # the guard exists to prevent slip through.
          violations=$(git grep -lnE '(from\s+"[^"]*(agentPromptExecution|runAgentTurn)"|from\s+'"'"'[^'"'"']*(agentPromptExecution|runAgentTurn)'"'"'|import\s*\(\s*"[^"]*(agentPromptExecution|runAgentTurn)"|import\s*\(\s*'"'"'[^'"'"']*(agentPromptExecution|runAgentTurn)'"'"')' -- 'src/*.ts' 'src/**/*.ts' \
            | grep -v '^src/worker\.ts$' \
            | grep -v '^src/agents/agentPromptExecution\.ts$' \
            | grep -v '^src/agents/agentPromptExecution\.test\.ts$' \
            | grep -v '^src/agents/runAgentTurn\.ts$' \
            | grep -v '^src/agents/runAgentTurn\.test\.ts$' \
            | grep -v '\.test\.ts$' \
            || true)
          if [ -n "$violations" ]; then
            printf 'FAIL: direct executeAgentPrompt/runAgentTurn import outside the worker — enqueue via getAgentPromptQueue() instead:\n%s\n' "$violations"
            exit 1
          fi
      - name: Forbid raw async route handlers without asyncHandler() wrap (HEL-184)
        run: |
          # HEL-184: every async Express route handler must be wrapped in
          # `asyncHandler()` from src/middleware/asyncHandler.ts. The wrapper
          # forwards rejected promises to `next(err)` so the global typed-error
          # middleware (src/app.ts) can render `Tier1ConnectorError` subclasses
          # — unhandled rejections in Express 4 silently hang the response.
          # The asyncHandler primitive is a no-op after the Express 4 → 5
          # migration, but the call-site shape stays stable.
          #
          # Iteration history (Codex on PR #943):
          #   round 1: `\([^,]+,(\s*\w+\s*,)*\s*async\s*\(` missed
          #            call-expression middleware (`upload.single("file")`).
          #   round 2: `.*async\s*\(` is line-oriented — misses routes that
          #            split `router.post(...,\n  async (...) => {...})`
          #            across lines, and the test-file filter `\.test\.ts$`
          #            never matches because `-n` output ends in `:content`.
          # This iteration uses awk over a window of the next 5 lines after
          # each `router.<verb>(` opener, accepts asyncHandler anywhere in
          # the window as success, and excludes tests via git pathspec.
          violations=$(
            for f in $(git ls-files 'src/*.ts' 'src/**/*.ts' ':!**/*.test.ts' ':!**/__mocks__/**'); do
              awk -v file="$f" '
                # Two-pass per route: scan a 20-line window starting at the
                # opener. If we see `asyncHandler` anywhere in the window
                # the route is wrapped. We only emit a violation if no
                # `asyncHandler` mention appears AND we did see an
                # `async (` (route handler shape) somewhere in the window.
                # This avoids false positives from middleware that itself
                # uses async arrow fns (e.g. `getCurrent: async (req) => ...`
                # in requireEntitlement options) preceding the real wrap.
                /^\s*(app|router)\.(get|post|put|patch|delete|use)\s*\(/ {
                  if (open_ln && saw_async && !saw_wrap) {
                    print file ":" open_ln ":" open_text
                  }
                  open_ln = NR; open_text = $0
                  saw_async = ($0 ~ /async\s*\(/)
                  saw_wrap  = ($0 ~ /asyncHandler/)
                  next
                }
                open_ln && (NR - open_ln) < 20 {
                  if ($0 ~ /asyncHandler/) saw_wrap = 1
                  if ($0 ~ /async\s*\(/)   saw_async = 1
                }
                open_ln && (NR - open_ln) == 20 {
                  if (saw_async && !saw_wrap) {
                    print file ":" open_ln ":" open_text
                  }
                  open_ln = 0; saw_async = 0; saw_wrap = 0
                }
                END {
                  if (open_ln && saw_async && !saw_wrap) {
                    print file ":" open_ln ":" open_text
                  }
                }
              ' "$f"
            done
          )
          if [ -n "$violations" ]; then
            printf 'FAIL: async route handler without asyncHandler() wrap detected:\n%s\n' "$violations"
            exit 1
          fi

  test-api:
    name: Test API (TypeScript)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run test:coverage
      - name: Upload API coverage to Codecov
        continue-on-error: true
        uses: codecov/codecov-action@v5
        if: always()
        with:
          files: coverage/lcov.info
          disable_search: true
          flags: api
          fail_ci_if_error: false
          handle_no_reports_found: true
          use_oidc: true

  test-api-integration:
    name: Test API Integration (TypeScript + Postgres)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: autoflow
          POSTGRES_PASSWORD: autoflow
          POSTGRES_DB: autoflow_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      DATABASE_URL: postgresql://autoflow:autoflow@localhost:5432/autoflow_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npx jest --config jest.config.cjs --runInBand --forceExit --testPathPattern='integration\.test\.ts$'

  test-frontend:
    name: Test Frontend (Dashboard)
    if: github.ref_name != 'dev' && (github.event_name != 'pull_request' || github.base_ref != 'dev')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm run test:coverage
      - name: Upload dashboard coverage to Codecov
        continue-on-error: true
        uses: codecov/codecov-action@v5
        if: always()
        with:
          files: dashboard/coverage/lcov.info
          disable_search: true
          flags: dashboard
          fail_ci_if_error: false
          handle_no_reports_found: true
          use_oidc: true

  build-frontend:
    name: Build Frontend (Dashboard)
    if: github.ref_name != 'dev' && (github.event_name != 'pull_request' || github.base_ref != 'dev')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm run build

  auth-regression:
    name: Auth Regression Smoke (Playwright)
    if: github.ref_name != 'dev' && (github.event_name != 'pull_request' || github.base_ref != 'dev')
    runs-on: ubuntu-latest
    needs: [test-frontend, build-frontend]
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Install Infisical CLI
        # Playwright's webServer directive starts the dashboard via `npm run dev`,
        # which is wrapped with `infisical run --env=dev -- ...` (HEL-39). Without
        # the CLI here, the start command exits 127. Install it before npm ci so
        # the binary is on PATH when Playwright spawns the dev server.
        run: |
          curl -1sLf 'https://artifacts-cli.infisical.com/setup.deb.sh' | sudo -E bash
          sudo apt-get update
          sudo apt-get install -y infisical
          infisical --version
      - run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit
      - name: Pull dashboard preview secrets from Infisical
        uses: Infisical/secrets-action@v1.0.9
        with:
          method: universal
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          project-slug: auto-flow-va-pt
          env-slug: dev
      - name: Run auth regression smoke tests
        run: npm run e2e:auth-regression
        env:
          CI: true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-auth-regression-report
          path: dashboard/playwright-report/
          retention-days: 7

  e2e:
    name: E2E Tests (Dashboard)
    if: github.ref_name != 'dev' && (github.event_name != 'pull_request' || github.base_ref != 'dev')
    runs-on: ubuntu-latest
    needs: [test-frontend, build-frontend]
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Install Infisical CLI
        # Same as auth-regression — npm run dev now wraps with `infisical run`,
        # so the CLI must be on PATH before Playwright starts the dev server.
        run: |
          curl -1sLf 'https://artifacts-cli.infisical.com/setup.deb.sh' | sudo -E bash
          sudo apt-get update
          sudo apt-get install -y infisical
          infisical --version
      - run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit
      - name: Pull dashboard preview secrets from Infisical
        uses: Infisical/secrets-action@v1.0.9
        with:
          method: universal
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          project-slug: auto-flow-va-pt
          env-slug: dev
      - name: Run E2E tests
        run: npm run e2e
        env:
          CI: true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: dashboard/playwright-report/
          retention-days: 7

  build-check:
    name: Docker Build Check
    runs-on: ubuntu-latest
    needs: [test-api, test-api-integration, test-frontend, build-frontend]
    if: |
      always() &&
      needs.test-api.result == 'success' &&
      needs.test-api-integration.result == 'success' &&
      (needs.test-frontend.result == 'success' || needs.test-frontend.result == 'skipped') &&
      (needs.build-frontend.result == 'success' || needs.build-frontend.result == 'skipped')
    strategy:
      matrix:
        service: [api, frontend]
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Build ${{ matrix.service }} image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/${{ matrix.service }}/Dockerfile
          push: false
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
